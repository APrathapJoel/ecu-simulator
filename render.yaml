services:
  - type: web
    name: ecu-api-server
    env: node
    region: oregon
    plan: free
    buildCommand: npm install -g pnpm && pnpm install && pnpm run --filter @workspace/api-server build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: NODE_ENV
        value: production

  - type: web
    name: ecu-dashboard
    env: static
    buildCommand: npm install -g pnpm && pnpm install && pnpm run --filter @workspace/ecu-dashboard build
    staticPublishPath: artifacts/ecu-dashboard/dist/public
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: ecu-api-server
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
